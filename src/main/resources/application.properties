spring.application.name=SpringBootTwitchBot
# Default profile. On the server run with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
spring.profiles.active=dev
server.port=8081
#server.servlet.session.timeout=14d
server.servlet.session.timeout=1209600s

#spring.sql.init.mode=always
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database=POSTGRESQL

logging.level.root=INFO

# Bot identity / config (non-secret) - centralizes values previously hardcoded in the event handlers.
bot.owner=maximuz666
bot.moderators=maximuz666,happasc2,winretkristin
bot.bot-account-name=maximuz_bot
# Which channels to connect on startup (comma-separated): test, main, second
bot.channels=test,main

